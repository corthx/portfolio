[tools]
node = "24.22.3"
# Same version as packageManager in package.json: Renovate reads that one to pick
# the npm it writes package-lock.json with, so both must move together.
"npm:npm" = { version = "11.21.3", depends = ["node"] }
markdownlint-cli2 = { version = "0.24.2", depends = ["node"] }
opentofu = "1.12.6"
python = "3.15.2"
pipx = { version = "1.18.19", depends = ["python"] }
"pipx:yamllint" = { version = "1.38.0", depends = ["pipx"] }
pre-commit = { version = "4.7.0", depends = ["python"] }
shellcheck = "0.11.0"
tflint = "0.66.0"

[task_config]
includes = [
  ".mise/pre-commit.toml",
  ".mise/tofu.toml",
]

[vars]
tofu_dir = "{{ config_root }}/terraform/"
