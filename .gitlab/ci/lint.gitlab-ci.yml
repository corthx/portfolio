---
lint:
  stage: lint
  needs: []
  dependencies: []
  extends:
    - .default-retry
    - .interruptible
    - .toolset:lint
  cache:
    - !reference [".mise-cache", cache]
    - !reference [".pre-commit-cache", cache]
    - !reference [".npm-cache", cache]
  rules:
    - !reference [".lint:rules", rules]
  variables:
    # Full history, so pre-commit can diff against CI_MERGE_REQUEST_DIFF_BASE_SHA.
    # The runner's default shallow clone has no merge base to reach.
    GIT_DEPTH: "0"
  before_script:
    - !reference [".mise-before_script", before_script]
    - !reference [".npm-before_script", before_script]
  script:
    # Unquoted: LINT_TASK, set per rule in .lint:rules, holds the task and its
    # arguments.
    - mise run $LINT_TASK

lint:renovate-config:
  stage: lint
  needs: []
  dependencies: []
  extends:
    - .renovate-image
    - .default-retry
    - .interruptible
  rules:
    - !reference [".lint:renovate-config:rules", rules]
  script:
    # --strict also fails on options Renovate would silently migrate.
    - renovate-config-validator --strict
